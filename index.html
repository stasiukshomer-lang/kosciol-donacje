<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wesprzyj Kościół Zielonoświątkowy „Słowo Wiary” w Gdańsku</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f3f4f6;
      color: #1f2937;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }
    .card {
      width: 100%;
      max-width: 520px;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }
    .hero {
      padding: 36px 28px 24px;
      text-align: center;
      background: #1e293b;
      color: #ffffff;
    }
    .logo {
      width: 110px;
      height: 110px;
      margin: 0 auto 16px;
      border-radius: 50%;
      background: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 3px solid #38bdf8;
    }
    .logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 22px;
      font-weight: 700;
      line-height: 1.3;
    }
    .hero p {
      margin: 0;
      opacity: 0.85;
      font-size: 14px;
      line-height: 1.5;
    }
    .form {
      padding: 28px 28px 32px;
    }
    .label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #374151;
    }
    .field {
      margin-bottom: 20px;
    }
    /* Кнопки быстрого выбора суммы */
    .amount-buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }
    .btn-amt {
      background: #f3f4f6;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      padding: 10px 0;
      font-size: 15px;
      font-weight: 600;
      color: #1f2937;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-amt:hover, .btn-amt.active {
      background: #2563eb;
      color: #ffffff;
      border-color: #2563eb;
    }
    input[type="number"],
    input[type="text"],
    input[type="email"] {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }
    .amount-input {
      font-size: 20px;
      font-weight: 700;
    }
    .submit-btn {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 16px;
      font-size: 16px;
      font-weight: 700;
      background: #2563eb;
      color: #ffffff;
      cursor: pointer;
      transition: background 0.2s;
    }
    .submit-btn:hover {
      background: #1d4ed8;
    }
    .note {
      margin: 14px 0 0;
      font-size: 12px;
      line-height: 1.5;
      color: #6b7280;
      text-align: center;
    }
    .footer-links {
      text-align: center;
      margin-top: 20px;
      font-size: 12px;
      color: #6b7280;
    }
    .footer-links a {
      color: #2563eb;
      text-decoration: none;
    }
    .footer-links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

<div class="wrap">
  <main class="card">
    <section class="hero">
      <div class="logo">
        <img src="logo.jpg" alt="Kościół Zielonoświątkowy Słowo Wiary w Gdańsku">
      </div>
      <h1>Kościół Zielonoświątkowy „Słowo Wiary”</h1>
      <p>Dziękujemy za Twoją dobrowolną darowiznę na wsparcie działalności naszego Kościoła.</p>
    </section>

    <section class="form">
      <!-- Напрямую в Tpay -->
      <form id="donationForm" action="https://secure.tpay.com" method="post">
        
        <!-- Замените на ваш реальный ID мерчанта в системе Tpay -->
        <input type="hidden" name="id" value="222409">
        
        <!-- Назначение платежа -->
        <input type="hidden" name="description" value="Darowizna na cele kultu religijnego - Słowo Wiary Gdańsk">
        
        <!-- Ссылка для возврата после оплаты (ваш GitHub Pages URL) -->
        <input type="hidden" name="return_url" value="https://stasiukshomer-lang.github.io/kosciol-donacje/">

        <!-- Быстрый выбор суммы -->
        <div class="field">
          <label class="label">Wybierz kwotę darowizny (PLN)</label>
          <div class="amount-buttons">
            <button type="button" class="btn-amt" onclick="setAmount(20, event)">20 zł</button>
            <button type="button" class="btn-amt" onclick="setAmount(50, event)">50 zł</button>
            <button type="button" class="btn-amt" onclick="setAmount(100, event)">100 zł</button>
            <button type="button" class="btn-amt" onclick="setAmount(200, event)">200 zł</button>
          </div>
          <input class="amount-input" id="amount" name="amount" type="number" min="1" step="0.01" placeholder="Inna kwota" required>
        </div>

        <div class="field">
          <label class="label" for="name">Imię i nazwisko</label>
          <input id="name" name="name" type="text" placeholder="Jan Kowalski">
        </div>

        <div class="field">
          <label class="label" for="email">E-mail</label>
          <input id="email" name="email" type="email" placeholder="jan@example.com" required>
        </div>

        <button type="submit" class="submit-btn">Przejdź do płatności Tpay</button>
        
        <p class="note">
          Zostaniesz bezpiecznie przekierowany do systemu Tpay (BLIK, przelew bankowy, karta).
        </p>
      </form>

      <div class="footer-links">
        <p>Kościół Zielonoświątkowy „Słowo Wiary” w Gdańsku</p>
        <a href="https://kzgdansk.org" target="_blank">kzgdansk.org</a>
      </div>
    </section>
  </main>
</div>

<script>
  function setAmount(val, event) {
    document.getElementById('amount').value = val;
    const buttons = document.querySelectorAll('.btn-amt');
    buttons.forEach(btn => btn.classList.remove('active'));
    event.target.classList.add('active');
  }
</script>

</body>
</html>
