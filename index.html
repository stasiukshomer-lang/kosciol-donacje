<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wesprzyj Kościół Słowo Wiary</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f7f5f1;color:#222}
.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 16px}
.card{width:100%;max-width:560px;background:#fff;border-radius:24px;box-shadow:0 14px 45px rgba(0,0,0,.10);overflow:hidden}
.hero{padding:42px 32px 28px;text-align:center;background:linear-gradient(135deg,#1f2937,#374151);color:#fff}
.logo{width:120px;height:120px;margin:0 auto 18px;border-radius:50%;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden}.logo img{width:100%;height:100%;object-fit:cover;display:block}
h1{margin:0 0 10px;font-size:30px;line-height:1.15}.hero p{margin:0;opacity:.88;font-size:16px;line-height:1.5}
.form{padding:30px 32px 34px}.label{display:block;font-size:14px;font-weight:700;margin:0 0 8px}
input{width:100%;padding:15px 16px;border:1px solid #d6d3d1;border-radius:12px;font-size:17px;outline:none}
input:focus{border-color:#374151;box-shadow:0 0 0 3px rgba(55,65,81,.10)}
.field{margin-bottom:18px}.amount{font-size:24px;font-weight:700}
button{width:100%;border:0;border-radius:12px;padding:16px;font-size:17px;font-weight:800;background:#111827;color:#fff;cursor:pointer}
button:hover{opacity:.92}.note{margin:15px 0 0;font-size:12px;line-height:1.5;color:#6b7280;text-align:center}
.links{text-align:center;margin-top:22px;font-size:12px}.links a{color:#4b5563;text-decoration:underline}
</style>
</head>
<body>
<div class="wrap">
  <main class="card">
    <section class="hero">
      <div class="logo"><img src="logo.jpg" alt="Słowo Wiary Gdańsk"></div>
      <h1>Wesprzyj Kościół Słowo Wiary</h1>
      <p>Dziękujemy za Twoją dobrowolną darowiznę na działalność naszego Kościoła.</p>
    </section>
    <section class="form">
      <form id="donationForm" action="PAYMENT_ENDPOINT" method="post">
        <div class="field">
          <label class="label" for="amount">Kwota darowizny (PLN)</label>
          <input class="amount" id="amount" name="amount" type="number" min="1" step="0.01" placeholder="Wpisz dowolną kwotę" required>
        </div>
        <div class="field">
          <label class="label" for="name">Imię i nazwisko</label>
          <input id="name" name="name" type="text" placeholder="Opcjonalnie">
        </div>
        <div class="field">
          <label class="label" for="email">E-mail</label>
          <input id="email" name="email" type="email" placeholder="Opcjonalnie">
        </div>
        <button type="submit">Przejdź do płatności Tpay</button>
        <p class="note">Po kliknięciu nastąpi bezpieczne przekierowanie do systemu płatności Tpay, gdzie wybierzesz dostępną metodę płatności.</p>
      </form>
      <div class="links">
        <a href="/polityka-prywatnosci">Polityka prywatności</a>
      </div>
    </section>
  </main>
</div>
</body>
</html>
